name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID:   ${{ secrets.GCP_PROJECT_ID }}
  REGION:       ${{ secrets.GCP_REGION }}          # e.g. us-central1
  REPO:         ${{ secrets.AR_REPO }}              # Artifact Registry repo name, e.g. campaign-os
  IMAGE:        campaign-os
  SERVICE:      campaign-os

jobs:
  build-and-deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── GCP auth via Workload Identity Federation (no long-lived JSON key) ──
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account:            ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Build & push ─────────────────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:latest

      # ── Deploy to Cloud Run ──────────────────────────────────────────────────
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region:  ${{ env.REGION }}
          image:   ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}
            VITE_DEEPSEEK_API_KEY=${{ secrets.VITE_DEEPSEEK_API_KEY }}
            VITE_QWEN_API_KEY=${{ secrets.VITE_QWEN_API_KEY }}
            VITE_DOUBAO_API_KEY=${{ secrets.VITE_DOUBAO_API_KEY }}
            VITE_Kimi_API_KEY=${{ secrets.VITE_Kimi_API_KEY }}
            VITE_REPORTER_EMAIL=${{ secrets.VITE_REPORTER_EMAIL }}
            VITE_REPORTER_ORG=${{ secrets.VITE_REPORTER_ORG }}
          flags: --allow-unauthenticated --min-instances=0 --max-instances=10 --memory=512Mi --cpu=1
